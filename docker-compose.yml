version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai_excel_postgres
    environment:
      POSTGRES_DB: ai_excel_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_excel_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
